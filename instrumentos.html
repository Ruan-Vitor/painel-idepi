<style>
/* ═══ Estilos exclusivos de Todos os Instrumentos ═════════════════════════
   Pedido do Ruan (passagem de 30/09/2026, item 13): ver TODOS os
   instrumentos sem a ordem por vigência, filtrar combinando, abrir o
   detalhe e levar para o Excel. Casca, cartão no celular (.tbl-cards) e
   texto que abre com um toque (.txt-exp) vêm do app.css.                  */
:root{--surface2:#f0f4f8;--border:#e2e8f0;--text:#1e293b;--muted:#64748b}
body{font-family:'Inter',sans-serif;color:var(--text)}

/* width:100% (01/10/2026). Dentro do .content, que é coluna flexível, a
   margem automática faz a .main medir pelo conteúdo, e o conteúdo mais largo
   é a barra de filtros, que no celular fica numa linha só e rola de lado
   (1.100 px). O cartão ficava largo e os valores caíam fora da tela. */
.main{max-width:1400px;width:100%;min-width:0;margin:0 auto;padding:24px}
.ptitle{font-size:19px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ptitle i{color:var(--brand);font-size:16px}

.panel{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden}
.phead{padding:12px 16px 0;display:block}
.ins-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sbar{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.sbar:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,58,110,.12)}
.sbar i{color:#94a3b8;font-size:13px}
.sbar input{border:none;outline:none;font-size:13px;color:var(--text);background:transparent;flex:1;font-family:'Inter',sans-serif;min-width:0}
.btn-col{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
.btn-col:hover{border-color:#9fb3cc}
.btn-col[aria-expanded="true"]{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}

/* Colunas: um botão por coluna, ligado = preenchido */
.cols-painel{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;margin:0 0 12px;background:var(--surface2);border-radius:10px}
.cols-painel[hidden]{display:none}
.cols-tit{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
.col-chip{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 11px;border-radius:999px;border:1px solid #d6dfeb;background:#fff;color:#1a2640;font:inherit;font-size:12px;cursor:pointer}
.col-chip i{font-size:10px;opacity:.6}
.col-chip[aria-pressed="true"]{background:#1a3a6e;border-color:#1a3a6e;color:#fff}
.col-chip[aria-pressed="true"] i{opacity:.9}
.col-padrao{border:0;background:none;color:#1a3a6e;font:inherit;font-size:12px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-left:auto}

.twrap{overflow:auto;max-height:calc(100vh - 290px);min-height:240px;border-top:1px solid var(--border)}
/* Barra de rolagem lateral TAMBÉM em cima (01/10/2026, pedido do Ruan): com
   muitas colunas, a de baixo fica longe quando a lista é comprida. É uma
   faixa vazia da largura da tabela, sincronizada com a rolagem dela. */
.rolagem-topo{overflow-x:auto;overflow-y:hidden;height:14px;border-top:1px solid var(--border)}
.rolagem-topo div{height:1px}
.rolagem-topo[hidden]{display:none}
/* A escolha do Excel: todas as colunas ou só as da tela. Os botões PRECISAM
   de classe: o app.css esconde botão sem classe nem id. */
.xls-escolha{position:fixed;z-index:3000;background:#fff;border:1px solid #d6dfeb;border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.18);padding:8px;display:flex;flex-direction:column;gap:4px;min-width:250px}
.xls-escolha .xls-op{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;font:inherit;color:#1a2640}
.xls-escolha .xls-op:hover,.xls-escolha .xls-op:focus-visible{background:#f1f5f9;outline:none}
.xls-escolha strong{font-size:13px}
.xls-escolha small{font-size:11.5px;color:#64748b}
table{border-collapse:collapse;font-size:12px;table-layout:fixed}
th{position:sticky;top:0;background:var(--surface2);padding:9px 14px 9px 12px;text-align:left;font-weight:600;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);z-index:1;white-space:nowrap;cursor:pointer;user-select:none;overflow:hidden;text-overflow:ellipsis}
th:hover{color:var(--brand)}
th.sorted-asc::after{content:' ▲';color:var(--brand);font-size:9px}
th.sorted-desc::after{content:' ▼';color:var(--brand);font-size:9px}
th.dir,td.dir{text-align:right}
/* A alça de largura: arrastar a borda direita do título */
.col-alca{position:absolute;top:0;right:0;width:9px;height:100%;cursor:col-resize;touch-action:none}
.col-alca::after{content:'';position:absolute;top:25%;bottom:25%;right:3px;width:2px;border-radius:2px;background:#cbd5e1;opacity:0;transition:opacity .15s}
th:hover .col-alca::after,.col-alca.ativa::after{opacity:1}
.col-alca.ativa::after{background:var(--brand)}
body.redimensionando,body.redimensionando *{cursor:col-resize!important;user-select:none!important}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top;overflow:hidden;overflow-wrap:anywhere}
tbody tr:hover td{background:#f8fafc}
.num{font-weight:600;color:var(--brand);font-size:11.5px;white-space:nowrap}
.muni{font-size:10.5px;color:#94a3b8;margin-top:3px}
.val{white-space:nowrap;font-variant-numeric:tabular-nums}
.org{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 8px;border-radius:999px;background:var(--brand-light);color:var(--brand);white-space:nowrap}
.vig{white-space:nowrap}
.prz{display:block;font-size:10px;font-weight:600;margin-top:2px}
.prz.normal{color:var(--n-tx)}.prz.alerta{color:var(--a-tx)}.prz.atencao{color:var(--at-tx)}
.prz.critico{color:var(--c-tx)}.prz.vencido{color:var(--v-tx)}.prz.finalizado{color:var(--f-tx)}
.prz.sem_data{color:#6d28d9}
td .cp-par{font-size:11.5px}
.cinza{color:#94a3b8}
.empty{text-align:center;padding:40px 24px;color:var(--muted)}
.empty i{font-size:36px;opacity:.3;margin-bottom:10px;display:block}

@media(max-width:900px){
  .main{padding:14px 12px}
  .ptitle{font-size:16px}
  .phead{padding:12px 12px 0}
  .twrap{max-height:none;overflow:visible;border-top:0;padding:12px 12px 2px}
  /* No celular a tabela vira cartão: largura de coluna não se aplica */
  table.tbl-cards{width:100%!important;table-layout:auto}
  table.tbl-cards colgroup{display:none}
  .col-alca{display:none}
  .rolagem-topo{display:none}
  td{overflow:visible}
  .btn-col span{display:none}
}
@media print{.phead,.sidebar,.hd{display:none!important}.twrap{max-height:none;overflow:visible}}
</style>

<script>
const esc = IDEPI.esc;
let dados = [], _gerado_em = '';
let sortCol = 'numero', sortDir = 1;

/* A LISTA QUE O EXCEL LÊ. Guardada aqui no fim de cada render, já filtrada
   e na ordem da tela. O Excel nunca raspa o HTML: a tabela vira cartão no
   celular e tem texto recolhido, e o que se lê dela não é o dado. */
let _visiveis = [];

const vazio = '<span class="cinza">—</span>';
const txt = v => esc(v) || vazio;
const GESTAO = { legado: 'Legado', nova: 'Nova gestão', proposta: 'Proposta' };

/* ── AS COLUNAS (01/10/2026) ──────────────────────────────────────────────
   Pedido do Ruan: botões para pôr e tirar coluna, largura ajustável, e a
   coluna SEI presente por padrão, com botão de copiar. Uma lista só decide
   cabeçalho, célula, ordem e largura: coluna nova entra AQUI e em nenhum
   outro lugar. `fixa` não sai (sem número e objeto a linha não diz de quem
   é); `padrao` é o que aparece para quem nunca escolheu.
   Os valores saem das mesmas funções do app.js que a tela e os filtros usam,
   para a ordem nunca discordar do que está escrito. */
const COLS = [
  { id: 'numero', xls: r => r.numero || '', rot: 'Nº', fixa: true, larg: 140,
    ord: r => (/^\d+$/.test(r.numero || '') ? '0 ' : '1 ') + (r.numero || ''),
    /* Os de código com letras (7AAALY) vêm depois dos numéricos. */
    cel: r => `<span class="num">${IDEPI.faixaFase(r)}<a class="num-link" href="execucao.html?num=${encodeURIComponent(r.numero || '')}" title="Abrir este instrumento">${esc(r.numero) || '—'}</a>${IDEPI.ficha.botao(r.numero || '')}</span>` },
  { id: 'objeto', xls: r => r.objeto || '', rot: 'Objeto / município', fixa: true, larg: 340, destaque: true,
    ord: r => (r.objeto || '').toLowerCase(),
    cel: r => { const m = (IDEPI.filtros.municipios(r) || []).join(', ');
      return `<div class="obj txt-exp">${esc(r.objeto) || '—'}</div>${m ? `<div class="muni"><i class="fa-solid fa-location-dot"></i> ${esc(m)}</div>` : ''}`; } },
  /* Sem SEI do instrumento, o da PCF, marcado (01/10/2026). */
  { id: 'sei', rot: 'Nº SEI', padrao: true, larg: 230,
    ord: r => IDEPI.seiDaTela(r).sei,
    xls: r => { const s = IDEPI.seiDaTela(r); return s.sei + (s.origem === 'pcf' ? ' (PCF)' : ''); },
    cel: r => { const s = IDEPI.seiDaTela(r);
      return IDEPI.numeroCopiavel(s.sei, IDEPI.linkSei(s.sei), 'Abrir o processo no SEI') +
        (s.origem === 'pcf' ? '<span class="sei-pcf" title="O instrumento não tem processo SEI próprio; este é o da prestação de contas">PCF</span>' : ''); } },
  { id: 'orgao', xls: r => r._orgao, rot: 'Órgão', padrao: true, larg: 100, ord: r => r._orgao,
    cel: r => `<div><span class="org">${esc(r._orgao)}</span></div>` },
  { id: 'concedente', xls: r => r._conc, rot: 'Concedente', padrao: true, larg: 110, ord: r => r._conc, cel: r => txt(r._conc) },
  { id: 'fiscal', xls: r => r.fiscal || '', rot: 'Fiscal', padrao: true, larg: 110, ord: r => (r.fiscal || '').toLowerCase(), cel: r => txt(r.fiscal) },
  { id: 'vigencia', xls: r => r.vigencia_fmt || r.vigencia || '', rot: 'Vigência', padrao: true, larg: 110,
    ord: r => { const d = IDEPI.parseDateBR(r.vigencia_fmt || r.vigencia); return d ? d.getTime() : Infinity; },
    cel: r => `<div><span class="vig">${esc(r.vigencia_fmt || r.vigencia) || '—'}</span><span class="prz ${r._st}">${esc(IDEPI.NOME_ST[r._st] || r._st)}</span></div>` },
  { id: 'total', xls: r => IDEPI.parseReais(r.v_total) || '', rot: 'Valor total', padrao: true, dir: true, larg: 140,
    ord: r => IDEPI.parseReais(r.v_total),
    cel: r => `<span class="val">${r.v_total ? esc(IDEPI.fmtReais(r.v_total)) : '—'}</span>` },
  { id: 'liberado', xls: r => r._lib, rot: 'Liberado', padrao: true, dir: true, larg: 140, ord: r => r._lib,
    cel: r => `<span class="val">${esc(IDEPI.fmtReais(r._lib))}</span>` },
  { id: 'dias', xls: r => (r._dias === null || r._dias === undefined) ? '' : r._dias, rot: 'Dias', dir: true, larg: 80, ord: r => (r._dias === null || r._dias === undefined) ? Infinity : r._dias,
    cel: r => (r._dias === null || r._dias === undefined) ? vazio : `<span class="val">${r._dias}</span>` },
  { id: 'suspensiva', xls: r => r.vigencia_suspensiva || '', rot: 'Suspensiva', larg: 110,
    ord: r => { const d = IDEPI.parseDateBR(r.vigencia_suspensiva); return d ? d.getTime() : Infinity; },
    cel: r => txt(r.vigencia_suspensiva) },
  { id: 'inicio', xls: r => r.vigencia_inicio || r.vigencia_inicio_tgov || '', rot: 'Início da vigência', larg: 120,
    ord: r => { const d = IDEPI.parseDateBR(r.vigencia_inicio || r.vigencia_inicio_tgov); return d ? d.getTime() : Infinity; },
    cel: r => txt(r.vigencia_inicio || r.vigencia_inicio_tgov) },
  { id: 'situacao', xls: r => r.situacao_tgov || '', rot: 'Situação (Transferegov)', larg: 170, ord: r => r.situacao_tgov || '', cel: r => txt(r.situacao_tgov) },
  { id: 'tipo', xls: r => r.tipo_instrumento || '', rot: 'Tipo', larg: 150, ord: r => r.tipo_instrumento || '', cel: r => txt(r.tipo_instrumento) },
  { id: 'gestao', xls: r => GESTAO[IDEPI.gestaoDe(r)] || '', rot: 'Gestão', larg: 110, ord: r => GESTAO[IDEPI.gestaoDe(r)] || '', cel: r => txt(GESTAO[IDEPI.gestaoDe(r)]) },
  { id: 'contrapartida', xls: r => IDEPI.parseReais(r.v_contrapartida) || '', rot: 'Contrapartida', dir: true, larg: 130, ord: r => IDEPI.parseReais(r.v_contrapartida),
    cel: r => r.v_contrapartida ? `<span class="val">${esc(IDEPI.fmtReais(r.v_contrapartida))}</span>` : vazio },
  { id: 'pct', xls: r => r.pct_exec || '', rot: '% execução', dir: true, larg: 100, ord: r => parseFloat(String(r.pct_exec || '').replace(',', '.')) || -1,
    cel: r => txt(r.pct_exec) },
  { id: 'mandataria', xls: r => r.mandataria || '', rot: 'Mandatária', larg: 160, ord: r => r.mandataria || '', cel: r => txt(r.mandataria) },
  { id: 'emenda', xls: r => r.dono_emenda || r.autor_emenda || '', rot: 'Dono da emenda', larg: 150, ord: r => r.dono_emenda || r.autor_emenda || '', cel: r => txt(r.dono_emenda || r.autor_emenda) },
  { id: 'ponto', xls: r => r.ponto_focal || '', rot: 'Ponto focal', larg: 140, ord: r => r.ponto_focal || '', cel: r => txt(r.ponto_focal) },
  { id: 'limite', xls: r => r.limite_prestacao || '', rot: 'Limite da prestação', larg: 130,
    ord: r => { const d = IDEPI.parseDateBR(r.limite_prestacao); return d ? d.getTime() : Infinity; },
    cel: r => txt(r.limite_prestacao) },
  { id: 'pcf', xls: r => r.pcf_etapa || '', rot: 'Etapa da PCF', larg: 120, ord: r => r.pcf_etapa || '', cel: r => txt(r.pcf_etapa) }
];
const COL = Object.fromEntries(COLS.map(c => [c.id, c]));

/* Escolha e larguras ficam NESTE aparelho (localStorage). Sem armazenamento
   (aba anônima, bloqueio), a página funciona com o padrão. */
const GUARDA = 'idepi.instrumentos.colunas.v1';
let _ligadas = COLS.filter(c => c.fixa || c.padrao).map(c => c.id);
let _larg = {};
try {
  const g = JSON.parse(localStorage.getItem(GUARDA) || 'null');
  if (g && Array.isArray(g.ligadas)) _ligadas = COLS.filter(c => c.fixa || g.ligadas.includes(c.id)).map(c => c.id);
  if (g && g.larg) _larg = g.larg;
} catch (e) {}
function guardar() {
  try { localStorage.setItem(GUARDA, JSON.stringify({ ligadas: _ligadas, larg: _larg })); } catch (e) {}
}
const visiveis = () => COLS.filter(c => _ligadas.includes(c.id));
const largDe = c => _larg[c.id] || c.larg;

function desenharPainelColunas() {
  document.getElementById('painelColunas').innerHTML =
    '<span class="cols-tit">Colunas</span>' +
    COLS.filter(c => !c.fixa).map(c => {
      const on = _ligadas.includes(c.id);
      return `<button type="button" class="col-chip" data-colchip="${c.id}" aria-pressed="${on}">` +
             `<i class="fa-solid ${on ? 'fa-check' : 'fa-plus'}"></i>${esc(c.rot)}</button>`;
    }).join('') +
    '<button type="button" class="col-padrao" data-colpadrao>Voltar ao padrão</button>';
}

function desenharCabecalho() {
  const cols = visiveis();
  document.getElementById('colunas').innerHTML = cols.map(c => `<col style="width:${largDe(c)}px">`).join('');
  document.getElementById('tabela').style.width = cols.reduce((s, c) => s + largDe(c), 0) + 'px';
  document.getElementById('cabecalho').innerHTML = cols.map(c =>
    `<th data-col="${c.id}" class="${c.dir ? 'dir' : ''}${c.id === sortCol ? (sortDir === 1 ? ' sorted-asc' : ' sorted-desc') : ''}" style="position:sticky">` +
    `${esc(c.rot)}<span class="col-alca" data-alca="${c.id}" title="Arraste para mudar a largura (duplo clique volta ao padrão)"></span></th>`
  ).join('');
}

const _topo = document.getElementById('rolagemTopo'), _twrap = document.getElementById('twrap');
function ajustarRolagemTopo() {
  const tab = document.getElementById('tabela');
  const sobra = tab.scrollWidth > _twrap.clientWidth + 1 && window.innerWidth > 900;
  _topo.hidden = !sobra;
  _topo.firstElementChild.style.width = tab.scrollWidth + 'px';
  if (sobra) _topo.scrollLeft = _twrap.scrollLeft;
}
let _sincronizando = false;
_topo.addEventListener('scroll', () => {
  if (_sincronizando) { _sincronizando = false; return; }
  _sincronizando = true; _twrap.scrollLeft = _topo.scrollLeft;
});
_twrap.addEventListener('scroll', () => {
  if (_sincronizando) { _sincronizando = false; return; }
  _sincronizando = true; _topo.scrollLeft = _twrap.scrollLeft;
});
if (window.ResizeObserver) {
  const ro = new ResizeObserver(ajustarRolagemTopo);
  ro.observe(document.getElementById('tabela'));
  ro.observe(_twrap);
} else window.addEventListener('resize', ajustarRolagemTopo);

function comparar(a, b) {
  const f = (COL[sortCol] || COL.numero).ord;
  const va = f(a), vb = f(b);
  if (typeof va === 'number' && typeof vb === 'number') return (va === vb ? 0 : (va < vb ? -1 : 1)) * sortDir;
  /* Número do instrumento é texto com dígitos: a comparação numérica do
     localeCompare põe 99 antes de 100. */
  return String(va).localeCompare(String(vb), 'pt-BR', { numeric: true }) * sortDir;
}

async function carregar() {
  try {
    const j = await IDEPI.dados.carregar();
    _gerado_em = j.gerado_em || '';
    IDEPI.usarHistorico(j.historico_repasses || {});
    // Tipo do instrumento e % de execução só chegam pela execução financeira.
    await IDEPI.juntarExecucao(j.convenios || []);
    dados = (j.convenios || []).map(c => {
      const s = IDEPI.calcStatus(c);
      return Object.assign(c, {
        _st: s.st, _dias: s.dias,
        _orgao: IDEPI.orgaoExecutorDe(c).rotulo,
        _conc: IDEPI.concedenteDe(c).sigla || '',
        _lib: IDEPI.liberadoDe(c)
      });
    });
    document.getElementById('ov').classList.add('hide');
    document.getElementById('hs-tot').textContent = dados.length;
    document.getElementById('hs-lib').textContent =
      IDEPI.fmtCompacto(dados.reduce((s, r) => s + r._lib, 0));
    document.getElementById('hd-ts').textContent = _gerado_em ? 'Dados de ' + _gerado_em : '';

    const q = new URLSearchParams(location.search).get('q');
    if (q) document.getElementById('busca').value = q;
    desenharPainelColunas();
    desenharCabecalho();
    render();
    // Os links do SEI e a PCF chegam à parte; quando chegam, a coluna SEI
    // ganha o link e, para quem não tem SEI próprio, o processo da PCF.
    IDEPI.carregarLinks().then(render);
    IDEPI.ficha.carregarPCF().then(() => { dados.forEach(r => { delete r._busca; }); render(); });
    // Todas as 7 dimensões: esta é a página de ver tudo, nenhuma fica de fora.
    // Espera a barra se desenhar para o contador dela já sair certo.
    await IDEPI.filtros.ligar({ depois: '#ancoraFiltros', aoMudar: render });
    render();
  } catch (e) {
    document.getElementById('ov').innerHTML = `
      <div style="color:#fca5a5;font-size:44px;margin-bottom:8px;"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <p style="color:#fff;">Não foi possível carregar os dados</p>
      <small>${esc(e.message || '')}<br>Verifique a conexão ou se os scripts Python já publicaram os dados.</small>`;
  }
}

function textoBusca(r) {
  if (!r._busca) r._busca = [r.numero, r.numero_original, r.objeto, r.municipio_emendas,
    IDEPI.seisDe(r).join(' '), IDEPI.seiDaTela(r).sei].join(' ').toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
  return r._busca;
}

/* O contador da barra é do filtros.js e não sabe da busca. Com busca ligada
   ele diria "18 de 107" com 1 linha na tela; aqui ele passa a contar o que
   está à vista. Roda depois do desenho da barra, a cada render. */
function contador(q) {
  const res = document.querySelector('.flt-res > span');
  if (!res) return;
  if (q || IDEPI.filtros.ativos())
    res.innerHTML = '<strong>' + _visiveis.length + '</strong> de ' + dados.length;
  else res.textContent = dados.length + ' instrumentos';
}

function render() {
  const q = document.getElementById('busca').value.trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
  let rows = dados.filter(r => IDEPI.filtros.passa(r));
  if (q) rows = rows.filter(r => textoBusca(r).includes(q) || IDEPI.casaConta(r.numero, q));
  rows.sort(comparar);
  _visiveis = rows;
  contador(q);

  const cols = visiveis();
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('tbody').innerHTML = rows.map(r =>
    '<tr>' + cols.map(c =>
      `<td${c.destaque ? ' class="celula-destaque"' : (c.dir ? ' class="dir"' : '')}>${c.cel(r)}</td>`
    ).join('') + '</tr>'
  ).join('');
  ajustarRolagemTopo();
}

document.getElementById('busca').addEventListener('input', () => {
  const v = document.getElementById('busca').value.trim();
  const p = new URLSearchParams(location.search);
  if (v) p.set('q', v); else p.delete('q');
  const s = p.toString();
  try { history.replaceState(null, '', location.pathname + (s ? '?' + s : '')); } catch (e) {}
  render();
});

/* Ordenar: clique no título. A alça de largura fica DENTRO do título, então o
   clique que termina um arraste não pode virar ordenação. */
let _arrastou = false;
document.getElementById('cabecalho').addEventListener('click', e => {
  if (_arrastou || e.target.closest('.col-alca')) return;
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  if (sortCol === th.dataset.col) sortDir = -sortDir;
  else { sortCol = th.dataset.col; sortDir = 1; }
  desenharCabecalho();
  render();
});

/* Largura: arrastar a alça (mouse, caneta ou dedo). Duplo clique volta ao
   padrão daquela coluna. */
document.getElementById('cabecalho').addEventListener('pointerdown', e => {
  const alca = e.target.closest('.col-alca');
  if (!alca) return;
  e.preventDefault();
  const id = alca.dataset.alca, c = COL[id];
  const idx = visiveis().findIndex(x => x.id === id);
  const col = document.getElementById('colunas').children[idx];
  const tabela = document.getElementById('tabela');
  const x0 = e.clientX, w0 = largDe(c), t0 = parseFloat(tabela.style.width) || 0;
  _arrastou = false;
  alca.classList.add('ativa');
  document.body.classList.add('redimensionando');
  try { alca.setPointerCapture(e.pointerId); } catch (er) {}
  const mover = ev => {
    const w = Math.max(60, Math.round(w0 + ev.clientX - x0));
    if (Math.abs(ev.clientX - x0) > 2) _arrastou = true;
    _larg[id] = w;
    col.style.width = w + 'px';
    tabela.style.width = (t0 + w - w0) + 'px';
  };
  const soltar = () => {
    alca.removeEventListener('pointermove', mover);
    alca.removeEventListener('pointerup', soltar);
    alca.removeEventListener('pointercancel', soltar);
    alca.classList.remove('ativa');
    document.body.classList.remove('redimensionando');
    guardar();
    setTimeout(() => { _arrastou = false; }, 0);
  };
  alca.addEventListener('pointermove', mover);
  alca.addEventListener('pointerup', soltar);
  alca.addEventListener('pointercancel', soltar);
});
document.getElementById('cabecalho').addEventListener('dblclick', e => {
  const alca = e.target.closest('.col-alca');
  if (!alca) return;
  delete _larg[alca.dataset.alca];
  guardar();
  desenharCabecalho();
});

/* Pôr e tirar colunas */
document.getElementById('btnColunas').addEventListener('click', () => {
  const p = document.getElementById('painelColunas'), b = document.getElementById('btnColunas');
  p.hidden = !p.hidden;
  b.setAttribute('aria-expanded', String(!p.hidden));
});
document.getElementById('painelColunas').addEventListener('click', e => {
  const chip = e.target.closest('[data-colchip]');
  if (chip) {
    const id = chip.dataset.colchip;
    if (_ligadas.includes(id)) _ligadas = _ligadas.filter(x => x !== id);
    else _ligadas = COLS.filter(c => c.id === id || _ligadas.includes(c.id)).map(c => c.id);  // mantém a ordem da lista
    if (!_ligadas.includes(sortCol)) { sortCol = 'numero'; sortDir = 1; }
  } else if (e.target.closest('[data-colpadrao]')) {
    _ligadas = COLS.filter(c => c.fixa || c.padrao).map(c => c.id);
    _larg = {};
  } else return;
  guardar();
  desenharPainelColunas();
  desenharCabecalho();
  render();
});

/* ── EXCEL ────────────────────────────────────────────────────────────────
   Lê _visiveis (o que a tela mostra, na ordem da tela). Valores em número,
   para somar no Excel. Com todas as colunas (27 + de onde veio o SEI) ou só
   as ligadas na tela, conforme a escolha no botão.
   A aba "Filtros" diz o que estava ligado: arquivo encaminhado precisa se
   explicar sem quem o gerou. */
/* O botão Excel pergunta (01/10/2026, pedido do Ruan): todas as colunas, que
   é o arquivo para trabalhar o dado, ou só as que estão na tela, que é o que
   se leva para mostrar. As LINHAS são as mesmas nos dois: as da tela. */
let _xlsMenu = null;
function fecharEscolhaExcel() { if (_xlsMenu) { _xlsMenu.remove(); _xlsMenu = null; } }
function escolherExcel(ev) {
  if (ev) ev.stopPropagation();
  if (_xlsMenu) { fecharEscolhaExcel(); return; }
  if (!dados.length) { alert('Dados ainda não carregados. Aguarde.'); return; }
  const b = document.getElementById('btnExcelIns'), r = b.getBoundingClientRect();
  _xlsMenu = document.createElement('div');
  _xlsMenu.className = 'xls-escolha';
  _xlsMenu.setAttribute('role', 'menu');
  _xlsMenu.innerHTML =
    `<button type="button" class="xls-op" role="menuitem" data-xls="todas"><strong>Todas as colunas</strong><small>28 colunas · ${_visiveis.length} instrumentos</small></button>` +
    `<button type="button" class="xls-op" role="menuitem" data-xls="tela"><strong>Só as colunas da tela</strong><small>${visiveis().length} colunas · ${_visiveis.length} instrumentos</small></button>`;
  (document.fullscreenElement || document.body).appendChild(_xlsMenu);
  const larg = _xlsMenu.offsetWidth;
  _xlsMenu.style.top = (r.bottom + 6) + 'px';
  _xlsMenu.style.left = Math.max(8, Math.min(r.right - larg, window.innerWidth - larg - 8)) + 'px';
  _xlsMenu.addEventListener('click', e => {
    const op = e.target.closest('[data-xls]');
    if (!op) return;
    const qual = op.dataset.xls;
    fecharEscolhaExcel();
    exportarExcel(qual === 'tela');
  });
  _xlsMenu.querySelector('button').focus();
}
document.addEventListener('click', e => { if (_xlsMenu && !_xlsMenu.contains(e.target)) fecharEscolhaExcel(); });
document.addEventListener('keydown', e => { if (_xlsMenu && e.key === 'Escape') { fecharEscolhaExcel(); document.getElementById('btnExcelIns').focus(); } });
window.addEventListener('resize', fecharEscolhaExcel);

function exportarExcel(soDaTela) {
  if (!dados.length) { alert('Dados ainda não carregados. Aguarde.'); return; }
  IDEPI.comBotaoOcupado('btnExcelIns', '<i class="fa-solid fa-file-excel"></i> Exportar Excel', function () {
    const GEST = { legado: 'Legado (até 2022)', nova: 'Nova gestão (2023 em diante)', proposta: 'Proposta' };
    const num = v => { const n = IDEPI.parseReais(v); return n || n === 0 ? n : ''; };
    const cab = ['Nº Instrumento','Nº original','Objeto','Município','Órgão executor','Concedente',
      'Tipo','Gestão','Fiscal','Ponto focal','Situação (Transferegov)','Início da vigência',
      'Fim da vigência','Status do prazo','Dias','Suspensiva','Valor total (R$)','Contrapartida (R$)',
      'Liberado (R$)','Última liberação','Valor da última liberação (R$)','% execução','Nº SEI','SEI de onde',
      'Mandatária','Autor da emenda','Limite da prestação','Etapa da PCF'];
    let cabF = cab, linhasF;
    if (soDaTela) {
      const cols = visiveis();
      cabF = cols.map(c => c.rot);
      linhasF = _visiveis.map(r => cols.map(c => c.xls(r)));
    }
    const linhas = soDaTela ? linhasF : _visiveis.map(r => [
      r.numero || '', r.numero_original || '', r.objeto || '',
      (IDEPI.filtros.municipios(r) || []).join(', '),
      r._orgao, IDEPI.concedenteDe(r).nome || r._conc, r.tipo_instrumento || '',
      GEST[IDEPI.gestaoDe(r)] || '', r.fiscal || '', r.ponto_focal || '',
      r.situacao_tgov || '', r.vigencia_inicio || r.vigencia_inicio_tgov || '',
      r.vigencia_fmt || r.vigencia || '', IDEPI.NOME_ST[r._st] || r._st,
      r._dias === null || r._dias === undefined ? '' : r._dias,
      r.vigencia_suspensiva || '', num(r.v_total), num(r.v_contrapartida), r._lib,
      r.ultima_liberacao || '', r.ultima_liberacao ? num(r.v_ultima_liberacao) : '',
      r.pct_exec || '', IDEPI.seiDaTela(r).sei, IDEPI.seiDaTela(r).origem === 'pcf' ? 'PCF' : (IDEPI.seiDaTela(r).sei ? 'Instrumento' : ''), r.mandataria || '',
      r.dono_emenda || r.autor_emenda || '', r.limite_prestacao || '', r.pcf_etapa || ''
    ]);
    const ws = XLSX.utils.aoa_to_sheet([cabF].concat(linhas));
    ws['!cols'] = soDaTela
      ? visiveis().map(c => ({ wch: Math.max(10, Math.min(60, Math.round(largDe(c) / 7))) }))
      : [12,12,60,24,12,30,22,24,16,18,24,12,12,12,7,12,16,16,16,12,16,9,24,11,24,24,12,12].map(w => ({ wch: w }));
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: linhas.length, c: cabF.length - 1 } }) };

    const fil = [['Filtro', 'Escolha']];
    const esc_ = IDEPI.filtros.escolhas();
    Object.keys(esc_).forEach(k => fil.push([k, esc_[k].join(', ')]));
    const busca = document.getElementById('busca').value.trim();
    if (busca) fil.push(['Busca', busca]);
    if (fil.length === 1) fil.push(['Nenhum', 'todos os instrumentos']);
    const wsF = XLSX.utils.aoa_to_sheet([['IDEPI · Todos os Instrumentos', ''], ['', '']].concat(fil).concat([
      ['', ''],
      ['Instrumentos no arquivo', _visiveis.length + ' de ' + dados.length],
      ['Ordem', 'a mesma da tela'],
      ['Colunas', soDaTela ? 'só as da tela' : 'todas'],
      ['Dados de', _gerado_em || ''],
      ['Gerado em', new Date().toLocaleString('pt-BR')]
    ]));
    wsF['!cols'] = [{ wch: 24 }, { wch: 50 }];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Instrumentos');
    XLSX.utils.book_append_sheet(wb, wsF, 'Filtros');
    XLSX.writeFile(wb, 'IDEPI_Instrumentos' + (soDaTela ? '_colunas_da_tela' : '') + '_' + IDEPI.carimboData() + '.xlsx');
  });
}

/* Lê o mesmo documento de Vigências, então segue a mesma liberação. */
IDEPI.auth.comPainel('vigencias', carregar);
