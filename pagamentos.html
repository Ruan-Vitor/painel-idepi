/* ═══ Estilos exclusivos da Relação de Pagamentos ═════════════════════════
   Header, sidebar, botões, login e responsivo estão em assets/app.css.    */

/* ── RESUMO ── */
.rs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex-shrink:0}
.rs-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:15px 17px;border-top:3px solid transparent;text-align:left;width:100%;font:inherit}
.rs-card.clicavel{cursor:pointer;transition:transform .14s,box-shadow .14s}
.rs-card.clicavel:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,58,110,.1)}
.rs-card.on{box-shadow:0 0 0 2px var(--accent) inset}
.rs-card.r-pg{border-top-color:#16a34a}
.rs-card.r-ag{border-top-color:#f97316}
.rs-card.r-br{border-top-color:#1a3a6e}
.rs-card.r-lq{border-top-color:#3b82f6}
.rs-num{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;color:var(--text);line-height:1.1;margin-bottom:4px}
.rs-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.rs-desc{font-size:10px;color:#b0bbc8;line-height:1.4}

/* ── CARTÃO DA LISTA ── */
.pg-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
.pg-head{padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pg-titulo{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.pg-titulo i{color:var(--accent)}
.pg-busca{flex:1;min-width:190px;max-width:360px;position:relative}
.pg-busca input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--border);
  border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--surface2)}
.pg-busca i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.pg-acoes{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.pg-lista{padding:2px 0;max-height:none}
/* Colunas: nº · empresa+obra · medição+SEI · valores. No celular vira uma
   coluna só — tela de toque não tem hover para o title salvar texto cortado. */
.pg-item{display:grid;grid-template-columns:96px minmax(0,1fr) 210px 150px;gap:14px;
  align-items:start;padding:11px 20px;border-bottom:1px solid var(--border);font-size:11.5px}
.pg-item:last-child{border-bottom:none}
.pg-num{font-weight:700;color:var(--accent);text-decoration:none;display:block}
.pg-num:hover{text-decoration:underline}
.pg-data{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.pg-emp{font-weight:600;color:var(--text)}
.pg-obra{color:var(--muted);margin-top:2px}
.pg-med{font-weight:700;color:var(--text)}
.pg-sei{display:block;color:var(--muted);font-size:10px;margin-top:2px;
  font-family:'IBM Plex Mono',ui-monospace,monospace}
.pg-val{text-align:right;line-height:1.5}
.pg-liq{font-weight:800;font-family:'Sora',sans-serif;font-size:12.5px;color:var(--text)}
.pg-bruto{color:var(--muted);font-size:9.5px}
.pg-tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:9px;
  border:1px solid;margin-left:6px;white-space:nowrap}
.pg-tag.ag{background:#fff7ed;color:#9a3412;border-color:#fdba74}
.pg-tag.pc{background:#f0fdf4;color:#166534;border-color:#86efac}
.pg-obs{grid-column:1/-1;background:var(--surface2);border-left:3px solid var(--border);
  padding:7px 11px;border-radius:0 7px 7px 0;font-size:10.5px;color:var(--muted);margin-top:2px}
.pg-vazio{padding:18px 20px;font-size:12px;color:var(--muted)}

/* ── BALÃO DA EMPRESA ──
   A empresa é o único campo da lista que responde a uma pergunta que a
   linha não responde: "quanto já pagamos a esta empresa, aqui e nos outros
   convênios". Vira botão — sublinhado pontilhado para dizer que abre algo,
   já que tela de toque não tem hover para insinuar isso. */
.pg-emp-btn{background:none;border:none;padding:0;font:inherit;color:inherit;
  font-weight:600;cursor:pointer;text-align:left;
  border-bottom:1px dotted var(--muted)}
.pg-emp-btn:hover,.pg-emp-btn:focus{color:var(--accent);border-bottom-color:var(--accent)}

.emp-pop{position:fixed;z-index:600;width:min(430px,calc(100vw - 24px));
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  box-shadow:0 18px 44px rgba(11,21,39,.26);
  max-height:min(72vh,600px);display:flex;flex-direction:column;overflow:hidden}
.emp-head{padding:12px 15px;border-bottom:1px solid var(--border);
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.emp-nome{font-family:'Sora',sans-serif;font-size:14px;font-weight:800;color:var(--text)}
.emp-sub{font-size:10px;color:var(--muted);margin-top:3px}
.emp-x{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:14px;padding:2px 4px;line-height:1}
.emp-x:hover{color:var(--text)}
.emp-corpo{overflow-y:auto}
.emp-sec{padding:11px 15px;border-top:1px solid var(--border)}
.emp-sec:first-child{border-top:none}
.emp-tit{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
  letter-spacing:.6px;margin-bottom:7px}
.emp-forte{font-family:'Sora',sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.emp-nota{font-size:10.5px;color:var(--muted);margin-top:3px}
.emp-linha{display:grid;grid-template-columns:66px minmax(0,1fr) 92px;gap:8px;
  padding:5px 0;border-top:1px dashed var(--border);font-size:10.5px;align-items:baseline}
.emp-linha:first-of-type{border-top:none}
.emp-linha b{font-weight:700;color:var(--text)}
.emp-linha .v{text-align:right;font-family:'Sora',sans-serif;font-weight:700;color:var(--text)}
.emp-linha .m{color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.emp-linha a{color:var(--accent);text-decoration:none;font-weight:700}
.emp-linha a:hover{text-decoration:underline}
.emp-ag{color:#9a3412}
.emp-rod{padding:9px 15px;border-top:1px solid var(--border);background:var(--surface2);
  font-size:9.5px;color:var(--muted);display:flex;gap:9px;align-items:center;
  justify-content:space-between;flex-wrap:wrap}
.emp-btn{background:var(--accent);color:#fff;border:none;border-radius:7px;
  padding:5px 10px;font:inherit;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap}
.emp-btn:hover{filter:brightness(1.08)}

/* No celular o balão vira gaveta no rodapé: flutuando ao lado do toque, ele
   ficaria embaixo do dedo e metade dele fora da tela. */
@media (max-width:640px){
  .emp-pop{left:8px!important;right:8px;top:auto!important;bottom:8px;
    width:auto;max-height:76vh}
}
.pg-mes{padding:7px 20px;background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

.pg-card:fullscreen{background:var(--surface);display:flex;flex-direction:column;border-radius:0;overflow:auto;padding:20px}
.pg-card:fullscreen .pg-lista{flex:1 1 auto;overflow:auto}
.pg-card:fullscreen .mes-lista{flex:1 1 auto;overflow:auto;max-height:none}

/* ── POR MÊS ──
   Barra proporcional ao maior mês. Sem biblioteca de gráfico: a leitura é
   comparativa ("qual mês pesou mais"), e para isso a barra basta — trazer
   Chart.js só para isto seria mais uma dependência de CDN a falhar. */
.mes-lista{max-height:340px;overflow-y:auto}
.mes-item{display:grid;grid-template-columns:120px minmax(0,1fr) 150px 150px;gap:12px;
  align-items:center;padding:9px 20px;border-bottom:1px solid var(--border);font-size:11.5px}
.mes-item:last-child{border-bottom:none}
.mes-item.atual{background:#f0f9ff}
.mes-rot{font-weight:700;color:var(--text);text-transform:capitalize}
.mes-rot small{display:block;font-weight:500;color:var(--muted);font-size:9.5px;text-transform:none}
.mes-track{background:#eef2f7;border-radius:99px;height:16px;overflow:hidden;position:relative}
.mes-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#1a3a6e,#3b82f6)}
.mes-fill.liq{background:linear-gradient(90deg,#0d6e4a,#22c55e);margin-top:-16px;opacity:.85}
.mes-val{text-align:right;font-family:'Sora',sans-serif;font-weight:700;font-size:11.5px;color:var(--text)}
.mes-val small{display:block;font-family:'DM Sans',sans-serif;font-weight:500;color:var(--muted);font-size:9.5px}
.mes-cab{display:grid;grid-template-columns:120px minmax(0,1fr) 150px 150px;gap:12px;
  padding:7px 20px;background:var(--surface2);border-bottom:1px solid var(--border);
  font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mes-cab div:nth-child(3),.mes-cab div:nth-child(4){text-align:right}

@media (max-width:900px){
  .rs-grid{grid-template-columns:repeat(2,1fr)}
  .pg-item{grid-template-columns:1fr;row-gap:7px}
  .pg-val{text-align:left}
  .mes-cab{display:none}
  .mes-item{grid-template-columns:1fr 1fr;row-gap:6px}
  .mes-item .mes-track{grid-column:1/-1}
  .mes-val{text-align:left}
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   RELAÇÃO DE PAGAMENTOS

   Origem: a planilha do diretor, publicada em painel/pagamentos pelo
   publicar_pagamentos.py. É o único lugar que registra A QUE MEDIÇÃO cada
   pagamento corresponde e em que processo SEI ela tramitou — no
   Transferegov o pagamento é uma linha de valor com favorecido.

   ⚠️  A página NÃO diz qual é a última medição de uma obra. Isso não é
   derivável: a planilha marca à mão, em texto livre, e só em 2 das 366
   linhas. Decidido com o setor em 06/08/2026 — mostra-se o NÚMERO da
   medição, que é o que existe, e não se afirma o que não se sabe.

   Regra de negócio nenhuma vive aqui: a situação (pago/aguardando) já vem
   classificada do Python, para planilha, script e painel não divergirem.
   ═══════════════════════════════════════════════════════════════════════ */

var _pagamentos = [];
var _meses      = [];
var _filtroSit  = null;

/** Ano-mês de HOJE, no relógio de quem está olhando.
 *  Não vem do Python de propósito: o documento pode ter sido publicado dias
 *  atrás, e "mês atual" tem de ser o mês de quem lê, não o da publicação. */
function ymHoje() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}

function fmtBR(n) {
  return 'R$ ' + (n || 0).toLocaleString('pt-BR',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function filtrarSituacao(sit) {
  _filtroSit = (_filtroSit === sit) ? null : sit;
  document.querySelectorAll('.rs-card[data-sit]').forEach(function (b) {
    b.classList.toggle('on', b.dataset.sit === _filtroSit);
  });
  IDEPI.$('btnLimpar').style.display = (_filtroSit || _filtroEmp) ? '' : 'none';
  render();
}

/** O que está à vista — é também o que a exportação leva. */
function visiveis() {
  var termo = IDEPI.norm(IDEPI.$('busca').value.trim());
  /* Do mais RECENTE para o mais antigo. A planilha é cronológica e a página
     nasceu copiando essa ordem — só que quem abre quer ver o que se pagou
     agora, e estava tendo de rolar 42 meses para chegar lá (07/08/2026).
     `slice()` antes de inverter: `reverse()` altera o array no lugar, e
     `_pagamentos` é a fonte de todas as outras contas da página. */
  return _pagamentos.slice().reverse().filter(function (p) {
    if (_filtroSit && p.situacao !== _filtroSit) return false;
    /* Por CHAVE, não pelo nome escrito: é o que faz "ver só esta empresa"
       trazer também as linhas em que ela foi digitada de outro jeito. */
    if (_filtroEmp && chaveEmp(p) !== _filtroEmp.chave) return false;
    if (!termo) return true;
    return IDEPI.norm([p.convenio, p.numero, p.empresa, p.obra, p.medicao,
                       p.sei, p.prestacao, p.mes, p.obs]
                      .join(' ')).indexOf(termo) !== -1;
  });
}

function render() {
  var lista = visiveis();
  IDEPI.setTxt('pg-qtd', lista.length +
    (lista.length === 1 ? ' lançamento' : ' lançamentos') +
    (_filtroEmp ? ' · ' + _filtroEmp.rotulo : ''));

  var box = IDEPI.$('lista');
  if (!lista.length) {
    box.innerHTML = '<div class="pg-vazio">Nenhum pagamento encontrado com esse filtro.</div>';
    return;
  }

  /* Cabeçalho de mês, como na planilha: é assim que o setor procura. */
  var mesAtual = null, html = '';
  lista.forEach(function (p) {
    if (p.mes !== mesAtual) {
      mesAtual = p.mes;
      if (mesAtual) html += '<div class="pg-mes">' + IDEPI.esc(mesAtual) + '</div>';
    }

    var tagSit = p.situacao === 'aguardando'
      ? '<span class="pg-tag ag">aguardando pagamento</span>' : '';
    var tagPC = /aprovad/i.test(p.prestacao || '')
      ? '<span class="pg-tag pc">' + IDEPI.esc(p.prestacao) + '</span>' : '';

    html += '<div class="pg-item">' +
      '<div>' +
        '<a class="pg-num" href="execucao.html?num=' +
          encodeURIComponent(p.numero || '') + '" ' +
          'title="Abrir a execução financeira deste instrumento">' +
          IDEPI.esc(p.convenio || p.numero) + '</a>' +
        '<span class="pg-data">' + IDEPI.esc(p.data || 'sem data') + '</span>' +
      '</div>' +
      '<div>' +
        '<div class="pg-emp">' + botaoEmpresa(p) + tagSit + '</div>' +
        '<div class="pg-obra">' + IDEPI.esc(p.obra || '') + tagPC + '</div>' +
      '</div>' +
      '<div>' +
        '<span class="pg-med">' + IDEPI.esc(p.medicao || '— sem nº de medição') + '</span>' +
        (p.sei ? '<span class="pg-sei">' + IDEPI.esc(p.sei) + '</span>' : '') +
      '</div>' +
      '<div class="pg-val">' +
        '<span class="pg-liq">' + fmtBR(p.liquido || p.bruto) + '</span>' +
        '<div class="pg-bruto">bruto ' + fmtBR(p.bruto) + '</div>' +
      '</div>' +
      (p.obs ? '<div class="pg-obs">' + IDEPI.esc(p.obs) + '</div>' : '') +
    '</div>';
  });
  box.innerHTML = html;
}

/* ═══════════════════════════════════════════════════════════════════════
   BALÃO DA EMPRESA

   Clicar na empresa responde duas perguntas que a linha da lista não
   responde: o que essa empresa já mediu NESTE instrumento, e o que ela já
   mediu NO GERAL — porque a mesma construtora costuma tocar obra em vários
   convênios.

   ⚠️  QUEM JUNTA AS GRAFIAS É O PYTHON, não esta página. A planilha é
   digitada à mão e a mesma empresa aparece como 'BS CONSTRUTORA',
   'B S CONSTRUTORA' e 'B S Construtora Eireli'; o publicar_pagamentos.py
   normaliza e publica `empresa_chave`. Fosse feito aqui, cada tela teria a
   sua cópia da regra — foi assim que o mesmo convênio passou a ter dois
   status em 26/07/2026.

   O balão MOSTRA as grafias que agrupou. Somar empresas erradas não dá erro
   nenhum na tela: dá um total que ninguém confere.
   ═══════════════════════════════════════════════════════════════════════ */

var _balao = null;
var _filtroEmp = null;      // { chave, rotulo } — filtro por empresa

/** Chave do agrupamento. O `||` é ponte para o documento publicado ANTES de
 *  06/2026… — antes de a chave existir: nesse caso cai no nome literal, que
 *  agrupa menos, mas nunca agrupa errado. */
function chaveEmp(p) {
  return p.empresa_chave ||
         IDEPI.norm(p.empresa || '').replace(/[^a-z0-9]/g, '');
}

function totais(lista) {
  var t = { qtd: 0, bruto: 0, liquido: 0 };
  lista.forEach(function (p) {
    t.qtd++; t.bruto += (p.bruto || 0); t.liquido += (p.liquido || 0);
  });
  return t;
}

/** Do mais recente para o mais antigo. Sem data vai para o fim — é medição
 *  na fila, e ela tem lugar próprio no balão. */
function porDataDesc(lista) {
  return lista.slice().sort(function (a, b) {
    var da = IDEPI.parseDateBR(a.data), db = IDEPI.parseDateBR(b.data);
    if (!da && !db) return 0;
    if (!da) return 1;
    if (!db) return -1;
    return db - da;
  });
}

function botaoEmpresa(p) {
  var nome = p.empresa || '';
  if (!nome) return '—';
  return '<button class="pg-emp-btn" title="Ver as medições desta empresa" ' +
    'onclick="abrirBalao(this,\'' + IDEPI.esc(chaveEmp(p)) + '\',\'' +
    IDEPI.esc(p.numero || '') + '\')">' + IDEPI.esc(nome) + '</button>';
}

function linhasMedicao(lista, comConvenio) {
  return lista.map(function (p) {
    return '<div class="emp-linha">' +
      '<div>' + (comConvenio
        ? '<a href="execucao.html?num=' + encodeURIComponent(p.numero || '') + '">' +
          IDEPI.esc(p.convenio || p.numero) + '</a>'
        : '<b class="' + (p.situacao === 'aguardando' ? 'emp-ag' : '') + '">' +
          IDEPI.esc(p.data || 'na fila') + '</b>') + '</div>' +
      '<div class="m">' + IDEPI.esc(p.medicao || 'sem nº de medição') +
        (comConvenio && p.data ? ' · ' + IDEPI.esc(p.data) : '') + '</div>' +
      '<div class="v">' + IDEPI.fmtCompacto(p.liquido || p.bruto) + '</div>' +
    '</div>';
  }).join('');
}

function fecharBalao() {
  if (_balao && _balao.parentNode) _balao.parentNode.removeChild(_balao);
  _balao = null;
}

function abrirBalao(el, chave, numero) {
  fecharBalao();

  var doGrupo  = _pagamentos.filter(function (p) { return chaveEmp(p) === chave; });
  if (!doGrupo.length) return;
  var noInstr  = doGrupo.filter(function (p) { return p.numero === numero; });
  /* Grafias da MAIS usada para a menos — é ela que vira o título do balão.
     Pela ordem de aparição, o consórcio da Pedra Redonda apareceria como
     'CONSORCIO S & G' (2 linhas) em vez de 'CONSÓRCIO S & G BARRAGEM
     CANINDÉ' (12). Empate desempata pela mais completa. */
  var conta = {};
  doGrupo.forEach(function (p) {
    if (p.empresa) conta[p.empresa] = (conta[p.empresa] || 0) + 1;
  });
  var grafias = Object.keys(conta).sort(function (a, b) {
    return (conta[b] - conta[a]) || (b.length - a.length);
  });

  var pagosI = porDataDesc(noInstr.filter(function (p) { return p.situacao === 'pago'; }));
  var filaI  = noInstr.filter(function (p) { return p.situacao === 'aguardando'; });
  var tI = totais(pagosI), tFilaI = totais(filaI);

  var pagosG = doGrupo.filter(function (p) { return p.situacao === 'pago'; });
  var filaG  = doGrupo.filter(function (p) { return p.situacao === 'aguardando'; });
  var tG = totais(pagosG), tFilaG = totais(filaG);

  /* Por instrumento, do que mais recebeu para o que menos. É a leitura que
     interessa: "onde mais essa empresa está". */
  var porNum = {};
  pagosG.forEach(function (p) {
    var k = p.numero || '—';
    var g = porNum[k] || (porNum[k] = { numero: k, convenio: p.convenio,
                                        qtd: 0, liquido: 0, ult: null });
    g.qtd++; g.liquido += (p.liquido || p.bruto || 0);
    var d = IDEPI.parseDateBR(p.data);
    if (d && (!g.ult || d > g.ult)) g.ult = d;
  });
  var instrumentos = Object.keys(porNum).map(function (k) { return porNum[k]; })
    .sort(function (a, b) { return b.liquido - a.liquido; });

  var conv = (noInstr[0] && noInstr[0].convenio) || numero || '—';
  var obra = (noInstr[0] && noInstr[0].obra) || '';

  var h = '';

  /* ── 1. Neste instrumento ── */
  h += '<div class="emp-sec">' +
    '<div class="emp-tit">Neste instrumento · ' + IDEPI.esc(conv) + '</div>';
  if (tI.qtd) {
    h += '<div class="emp-forte">' + tI.qtd +
      (tI.qtd === 1 ? ' medição paga' : ' medições pagas') + ' · ' +
      IDEPI.fmtCompacto(tI.liquido) + ' líquido</div>' +
      '<div class="emp-nota">bruto ' + IDEPI.fmtCompacto(tI.bruto) +
      ' · última em ' + IDEPI.esc(pagosI[0].data) + '</div>' +
      linhasMedicao(pagosI.slice(0, 5), false);
    if (pagosI.length > 5) {
      h += '<div class="emp-nota">+ ' + (pagosI.length - 5) +
           ' medição(ões) anterior(es)</div>';
    }
  } else {
    h += '<div class="emp-nota">Nenhuma medição paga registrada aqui.</div>';
  }
  if (tFilaI.qtd) {
    h += '<div class="emp-nota emp-ag" style="margin-top:6px"><b>' + tFilaI.qtd +
      (tFilaI.qtd === 1 ? ' medição enviada' : ' medições enviadas') +
      ' e ainda não paga(s)</b> · ' + IDEPI.fmtCompacto(tFilaI.bruto) + '</div>' +
      linhasMedicao(filaI, false);
  }
  h += '</div>';

  /* ── 2. A empresa no geral ── */
  h += '<div class="emp-sec">' +
    '<div class="emp-tit">Esta empresa no geral · ' + instrumentos.length +
    (instrumentos.length === 1 ? ' instrumento' : ' instrumentos') + '</div>' +
    '<div class="emp-forte">' + tG.qtd +
      (tG.qtd === 1 ? ' medição paga' : ' medições pagas') + ' · ' +
      IDEPI.fmtCompacto(tG.liquido) + ' líquido</div>' +
    '<div class="emp-nota">bruto ' + IDEPI.fmtCompacto(tG.bruto) +
      ' · retido ' + IDEPI.fmtCompacto(tG.bruto - tG.liquido) + '</div>';
  h += instrumentos.map(function (g) {
    return '<div class="emp-linha">' +
      '<div><a href="execucao.html?num=' + encodeURIComponent(g.numero) + '">' +
        IDEPI.esc(g.convenio || g.numero) + '</a></div>' +
      '<div class="m">' + g.qtd + (g.qtd === 1 ? ' medição' : ' medições') +
        (g.ult ? ' · até ' + g.ult.toLocaleDateString('pt-BR') : '') + '</div>' +
      '<div class="v">' + IDEPI.fmtCompacto(g.liquido) + '</div>' +
    '</div>';
  }).join('');
  if (tFilaG.qtd) {
    h += '<div class="emp-nota emp-ag" style="margin-top:6px">' + tFilaG.qtd +
      ' na fila em todos os convênios · ' + IDEPI.fmtCompacto(tFilaG.bruto) + '</div>';
  }
  h += '</div>';

  var pop = document.createElement('div');
  pop.className = 'emp-pop';
  pop.innerHTML =
    '<div class="emp-head">' +
      '<div><div class="emp-nome">' + IDEPI.esc(grafias[0]) + '</div>' +
      '<div class="emp-sub">' + IDEPI.esc(obra || 'sem obra informada') + '</div></div>' +
      '<button class="emp-x" onclick="fecharBalao()" title="Fechar" ' +
        'aria-label="Fechar">✕</button>' +
    '</div>' +
    '<div class="emp-corpo">' + h + '</div>' +
    '<div class="emp-rod">' +
      '<span>' + (grafias.length > 1
        ? 'agrupa ' + grafias.length + ' grafias: ' + IDEPI.esc(grafias.join(' · '))
        : 'grafia única na planilha') + '</span>' +
      '<button class="emp-btn" onclick="filtrarEmpresa(\'' + IDEPI.esc(chave) +
        '\')">Ver só esta empresa</button>' +
    '</div>';

  /* Em tela cheia o balão TEM de entrar dentro do elemento em fullscreen:
     o navegador desenha o fullscreen por cima de tudo, e um position:fixed
     pendurado no <body> simplesmente não apareceria. */
  (document.fullscreenElement || document.body).appendChild(pop);
  _balao = pop;
  posicionarBalao(pop, el);
}

/** Abaixo do nome clicado, preso dentro da tela. */
function posicionarBalao(pop, el) {
  var r = el.getBoundingClientRect();
  var c = pop.getBoundingClientRect();
  var esq = Math.max(8, Math.min(r.left, window.innerWidth - c.width - 8));
  var topo = r.bottom + 6;
  if (topo + c.height > window.innerHeight - 8) {
    topo = Math.max(8, r.top - c.height - 6);
  }
  pop.style.left = esq + 'px';
  pop.style.top = topo + 'px';
}

/* Fechar: clique fora, Esc, e rolagem — o balão é ancorado no elemento, e
   rolando a lista ele ficaria apontando para a linha errada. */
document.addEventListener('mousedown', function (e) {
  if (_balao && !_balao.contains(e.target) &&
      !(e.target.closest && e.target.closest('.pg-emp-btn'))) fecharBalao();
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') fecharBalao();
});
/* A rolagem DENTRO do balão não conta — ele tem lista própria e passa dos
   72vh em empresa com muitas medições. Sem esta guarda, arrastar a lista do
   balão o fechava na cara de quem estava lendo. */
document.addEventListener('scroll', function (e) {
  if (_balao && _balao.contains(e.target)) return;
  fecharBalao();
}, true);
window.addEventListener('resize', fecharBalao);

function filtrarEmpresa(chave) {
  var p = _pagamentos.filter(function (x) { return chaveEmp(x) === chave; })[0];
  _filtroEmp = { chave: chave, rotulo: (p && p.empresa) || chave };
  fecharBalao();
  IDEPI.$('btnLimpar').style.display = '';
  render();
}

function limparFiltros() {
  _filtroEmp = null;
  filtrarSituacao(null);          // já cuida do botão e do re-render
}

/* ── Medições pagas por mês ─────────────────────────────────────────────
   Duas barras no mesmo trilho: bruto atrás, líquido na frente. A diferença
   entre elas é a retenção, e vê-la mês a mês é o ponto — foi assim que se
   descobriu que `bruto − líquido` é exatamente a soma dos tributos. */
/* O bloco por mês nasce RECOLHIDO: ele é análise, e o que a pessoa abre a
   página para ver é o pagamento do mês corrente e o que falta pagar. Aberto
   por padrão, empurrava a lista para fora da tela. */
function alternarMeses() {
  var lista = IDEPI.$('mes-lista'), btn = IDEPI.$('btnAbrirMes');
  var abrindo = lista.hidden;
  lista.hidden = !abrindo;
  IDEPI.$('btnFSMes').hidden = !abrindo;
  btn.innerHTML = abrindo
    ? '<i class="fa-solid fa-chevron-up"></i> Recolher'
    : '<i class="fa-solid fa-chevron-down"></i> Ver por mês';
}

function renderMeses() {
  var box = IDEPI.$('mes-lista');
  if (!_meses.length) {
    box.innerHTML = '<div class="pg-vazio">Sem pagamentos com data para agrupar.</div>';
    return;
  }
  var teto = Math.max.apply(null, _meses.map(function (m) { return m.bruto; })) || 1;
  var hoje = ymHoje();

  /* Do mês mais recente para o mais antigo: o que interessa está no fim da
     planilha, e obrigar a rolar 42 meses para chegar nele é perder o dado. */
  var html = '<div class="mes-cab"><div>Mês</div><div>Bruto × líquido</div>' +
             '<div>Bruto</div><div>Líquido</div></div>';
  _meses.slice().reverse().forEach(function (m) {
    var ret = m.bruto - m.liquido;
    var pctRet = m.bruto ? (ret / m.bruto * 100) : 0;
    html += '<div class="mes-item' + (m.ym === hoje ? ' atual' : '') + '">' +
      '<div class="mes-rot">' + IDEPI.esc(m.rotulo) +
        '<small>' + m.qtd + (m.qtd === 1 ? ' medição' : ' medições') +
        (m.ym === hoje ? ' · mês atual' : '') + '</small></div>' +
      '<div class="mes-track" title="Retenção de ' + fmtBR(ret) + ' (' +
        pctRet.toFixed(1).replace('.', ',') + '%)">' +
        '<div class="mes-fill" style="width:' + (m.bruto / teto * 100) + '%"></div>' +
        '<div class="mes-fill liq" style="width:' + (m.liquido / teto * 100) + '%"></div>' +
      '</div>' +
      '<div class="mes-val">' + fmtBR(m.bruto) + '<small>bruto</small></div>' +
      '<div class="mes-val">' + fmtBR(m.liquido) +
        '<small>retido ' + fmtBR(ret) + '</small></div>' +
    '</div>';
  });
  box.innerHTML = html;

  var somaB = _meses.reduce(function (s, m) { return s + m.bruto; }, 0);
  var somaL = _meses.reduce(function (s, m) { return s + m.liquido; }, 0);
  IDEPI.setHtml('mes-resumo',
    '<span>' + _meses.length + ' meses</span>' +
    '<span>bruto <b>' + IDEPI.fmtCompacto(somaB) + '</b></span>' +
    '<span>líquido <b>' + IDEPI.fmtCompacto(somaL) + '</b></span>' +
    '<span>retido <b>' + IDEPI.fmtCompacto(somaB - somaL) + '</b></span>');
}

/* ── Mês atual e previsão ───────────────────────────────────────────────
   PREVISÃO = o que já foi pago no mês + as medições enviadas e ainda não
   pagas. Não é projeção estatística nem média de meses anteriores: é o que
   está na fila, com valor conhecido. Dito assim na tela, para ninguém ler
   como estimativa. */
function renderMesAtual(resumo) {
  var hoje = ymHoje();
  var m = _meses.filter(function (x) { return x.ym === hoje; })[0];
  var pagoB = m ? m.bruto : 0, pagoL = m ? m.liquido : 0, qtd = m ? m.qtd : 0;

  IDEPI.setTxt('rs-mes', IDEPI.fmtCompacto(pagoB));
  IDEPI.setTxt('rs-mes-sub', qtd
    ? qtd + (qtd === 1 ? ' medição' : ' medições') +
      ' · líquido ' + IDEPI.fmtCompacto(pagoL)
    : 'nenhum pagamento neste mês ainda');

  var fila = (resumo && resumo.aguardando_bruto) || 0;
  var nFila = (resumo && resumo.aguardando) || 0;
  IDEPI.setTxt('rs-prev', IDEPI.fmtCompacto(pagoB + fila));
  IDEPI.setTxt('rs-prev-sub', nFila
    ? 'pago + ' + nFila + (nFila === 1 ? ' medição enviada' : ' medições enviadas') +
      ' (' + IDEPI.fmtCompacto(fila) + ')'
    : 'nenhuma medição na fila');
}

function exportarPagamentos() {
  var lista = visiveis();
  if (!lista.length) { alert('Não há nada para exportar com o filtro atual.'); return; }

  IDEPI.comBotaoOcupado('btnExcelPag',
    '<i class="fa-solid fa-file-excel"></i> Exportar', function () {
    var cab = ['Mês', 'Convênio', 'Nº Instrumento', 'Empresa', 'Obra',
               'Medição', 'Processo SEI', 'Data do pagamento', 'Situação',
               'Valor bruto (R$)', 'Valor líquido (R$)',
               'Prestação de contas', 'Observação'];
    var linhas = lista.map(function (p) {
      return [p.mes || '', p.convenio || '', p.numero || '', p.empresa || '',
              p.obra || '', p.medicao || '', p.sei || '', p.data || '',
              p.situacao === 'aguardando' ? 'Aguardando pagamento' : 'Pago',
              p.bruto || 0, p.liquido || 0, p.prestacao || '', p.obs || ''];
    });
    var ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas));
    ws['!cols'] = [{wch:24},{wch:16},{wch:14},{wch:26},{wch:32},{wch:22},
                   {wch:24},{wch:16},{wch:20},{wch:18},{wch:18},{wch:22},{wch:40}];
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({
      s:{r:0,c:0}, e:{r:linhas.length, c:cab.length-1} }) };

    /* A aba por mês sai SEMPRE completa, mesmo com a lista filtrada: ela
       responde "quanto se pagou em cada mês", e um recorte de busca daria
       um total que não é o do mês. */
    var cabM = ['Mês', 'Medições', 'Bruto (R$)', 'Líquido (R$)', 'Retido (R$)'];
    var wsM = XLSX.utils.aoa_to_sheet([cabM].concat(_meses.map(function (m) {
      return [m.rotulo, m.qtd, m.bruto, m.liquido,
              Math.round((m.bruto - m.liquido) * 100) / 100];
    })));
    wsM['!cols'] = [{wch:18},{wch:11},{wch:18},{wch:18},{wch:18}];

    /* Planilha com 12 de 382 linhas e nada explicando por quê é a próxima
       divergência a ser investigada por quem não estava na sala. O recorte
       vai escrito. */
    var somaB = lista.reduce(function (s, p) { return s + (p.bruto || 0); }, 0);
    var somaL = lista.reduce(function (s, p) { return s + (p.liquido || 0); }, 0);
    var wsR = XLSX.utils.aoa_to_sheet([
      ['Relação de Pagamentos — IDEPI'],
      ['Exportado em', new Date().toLocaleString('pt-BR')],
      ['Busca',    IDEPI.$('busca').value.trim() || '(sem busca)'],
      ['Situação', _filtroSit || '(todas)'],
      ['Empresa',  _filtroEmp ? _filtroEmp.rotulo + ' (todas as grafias)' : '(todas)'],
      ['Lançamentos exportados', lista.length],
      ['Total bruto (R$)',   Math.round(somaB * 100) / 100],
      ['Total líquido (R$)', Math.round(somaL * 100) / 100],
      [],
      ['A aba "Por mês" sai sempre completa, sem o filtro acima.']
    ]);
    wsR['!cols'] = [{wch:26},{wch:44}];

    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsR, 'Resumo');
    XLSX.utils.book_append_sheet(wb, ws,  'Pagamentos');
    XLSX.utils.book_append_sheet(wb, wsM, 'Por mês');
    XLSX.writeFile(wb, 'IDEPI_Relacao_Pagamentos_' + IDEPI.carimboData() + '.xlsx');
  });
}

IDEPI.dados.pagamentos()
  .then(function (d) {
    _pagamentos = d.pagamentos || [];
    _meses      = d.meses || [];
    var r = d.resumo || {};
    IDEPI.setTxt('rs-pagos', r.pagos || 0);
    IDEPI.setTxt('rs-ag',    r.aguardando || 0);
    IDEPI.setTxt('hs-tot',   _pagamentos.length);
    IDEPI.setTxt('hd-ts', 'Atualizado: ' + (d.gerado_em || '—'));
    renderMeses();
    renderMesAtual(r);
    render();
    IDEPI.esconderOverlay();
  })
  .catch(function (e) {
    IDEPI.esconderOverlay();
    IDEPI.setHtml('hd-ts', '<span style="color:#f87171">Erro ao carregar</span>');
    IDEPI.setHtml('lista', '<div class="pg-vazio">Não foi possível carregar os ' +
      'pagamentos. ' + IDEPI.esc(String(e && e.message || e)) + '</div>');
  });

IDEPI.ligarBotaoFullscreen('btnFSPag');
IDEPI.ligarBotaoFullscreen('btnFSMes');
</script>
