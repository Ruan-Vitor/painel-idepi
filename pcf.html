/* ═══ Estilos exclusivos da Prestação de Contas ═══════════════════════════
   Header, sidebar, botões, login e responsivo estão em assets/app.css.    */

/* ── ETAPAS ── */
.et-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;flex-shrink:0}
.et-card{background:var(--surface);border:1px solid var(--border);border-radius:11px;
  padding:15px 17px;border-top:3px solid transparent;cursor:pointer;
  transition:transform .14s,box-shadow .14s;text-align:left;width:100%;font:inherit}
.et-card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(26,58,110,.1)}
.et-card.on{box-shadow:0 0 0 2px var(--accent) inset}
.et-card.e-ni{border-top-color:#ef4444}
.et-card.e-an{border-top-color:#eab308}
.et-card.e-ap{border-top-color:#3b82f6}
.et-card.e-cn{border-top-color:#16a34a}
.et-num{font-family:'Sora',sans-serif;font-size:28px;font-weight:800;color:var(--text);line-height:1;margin-bottom:4px}
.et-lbl{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.et-desc{font-size:10px;color:#b0bbc8;line-height:1.4}

/* ── CARTÕES DE PCF ── */
.pcf-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;flex-shrink:0}
.pcf-head{padding:14px 20px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pcf-title{font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.pcf-title i{color:var(--accent)}
.pcf-busca{flex:1;min-width:190px;max-width:340px;position:relative}
.pcf-busca input{width:100%;padding:7px 11px 7px 30px;border:1px solid var(--border);
  border-radius:8px;font-size:12px;font-family:inherit;color:var(--text);background:var(--surface2)}
.pcf-busca i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted)}

.pcf-lista{padding:4px 0}
.pcf-item{display:grid;grid-template-columns:112px 1fr 190px;gap:14px;
  padding:13px 20px;border-bottom:1px solid var(--border);align-items:start}
.pcf-item:last-child{border-bottom:none}
.pcf-item:hover{background:var(--surface2)}

.pcf-num{font-weight:700;font-size:12.5px;display:block;margin-bottom:5px}
.pcf-etapa{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 7px;
  border-radius:11px;white-space:nowrap;line-height:1.5}
.et-ni{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bdr)}
.et-an{background:#fefce8;color:#a16207;border:1px solid #fde68a}
.et-ap{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-bdr)}
.et-cn{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bdr)}
.et-ou{background:var(--slate-bg);color:var(--slate);border:1px solid var(--slate-bdr)}

.pcf-obj{font-size:12px;color:var(--text);line-height:1.45;margin-bottom:4px}
.pcf-meta{font-size:10.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.pcf-meta span{display:inline-flex;align-items:center;gap:4px}
.pcf-meta i{font-size:9px}

/* A Observação é a ÚNICA coluna que o sistema não sabe preencher: vem do
   SEI, escrita à mão pelo setor. Por isso ganha destaque próprio — é o que
   diz o que está travando a prestação. */
.pcf-obs{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;
  padding:8px 10px;font-size:11px;color:#78350f;line-height:1.45}
.pcf-obs strong{display:block;font-size:9px;text-transform:uppercase;
  letter-spacing:.5px;color:#92400e;margin-bottom:2px;font-weight:700}
.pcf-obs.vazia{background:var(--surface2);border-color:var(--border);color:var(--muted)}

.pcf-fora{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;
  font-weight:700;color:#92400e;background:#fffbeb;border:1px solid #fcd34d;
  border-radius:10px;padding:1px 6px;margin-left:6px}

/* Selo de origem da etapa. Discreto de propósito: informa sem competir com o
   rótulo da etapa, que é o que se lê primeiro. */
.pcf-fonte{display:inline-flex;align-items:center;gap:4px;font-size:9px;
  font-weight:600;padding:2px 7px;border-radius:9px;margin-left:6px;
  border:1px solid;vertical-align:middle}
.pcf-fonte.tg{background:#f0fdf4;color:#166534;border-color:#86efac}
.pcf-fonte.pl{background:#f8fafc;color:#64748b;border-color:#cbd5e1}
/* Já a divergência precisa PUXAR o olho: é ela que faz alguém ir corrigir a
   planilha. Em âmbar, como os outros avisos do sistema. */
.pcf-diverge{display:inline-flex;align-items:center;gap:4px;font-size:9px;
  font-weight:700;padding:2px 7px;border-radius:9px;margin-left:6px;
  background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-bdr);
  vertical-align:middle}
@media(max-width:680px){
  .pcf-fonte,.pcf-diverge{margin-left:0;margin-top:4px}
}
.pcf-vazio{padding:26px 20px;text-align:center;font-size:12.5px;color:var(--muted)}

@media(max-width:1000px){
  .et-grid{grid-template-columns:repeat(2,1fr)}
  .pcf-item{grid-template-columns:1fr;row-gap:9px}
}
</style>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PRESTAÇÃO DE CONTAS FINAL

   Origem: planilha "PCFs_Pendentes_Atualizado", mantida à mão pelo setor,
   publicada em painel/pcf pelo publicar_pcf.py.

   O que NÃO fazer aqui: reimplementar regra de status. A etapa já vem
   classificada do Python (etapa/etapa_rotulo) para que planilha, script e
   painel não divirjam — foi assim que o mesmo convênio chegou a ter dois
   status em julho.
   ═══════════════════════════════════════════════════════════════════════ */

var _pcfs = [];
var _filtroEtapa = null;

var CLASSE_ETAPA = {
  nao_iniciada: 'et-ni', em_analise: 'et-an',
  aprovada:     'et-ap', concluida:  'et-cn'
};

function filtrarEtapa(etapa) {
  _filtroEtapa = (_filtroEtapa === etapa) ? null : etapa;
  document.querySelectorAll('.et-card').forEach(function (b) {
    b.classList.toggle('on', b.dataset.etapa === _filtroEtapa);
  });
  IDEPI.$('btnLimpar').style.display = _filtroEtapa ? '' : 'none';
  render();
}

function render() {
  var termo = IDEPI.norm(IDEPI.$('busca').value.trim());
  var lista = _pcfs.filter(function (p) {
    if (_filtroEtapa && p.etapa !== _filtroEtapa) return false;
    if (!termo) return true;
    return IDEPI.norm([p.numero, p.objeto, p.objeto_oficial, p.processo,
                       p.observacao, p.situacao, p.municipio]
                      .join(' ')).indexOf(termo) !== -1;
  });

  var box = IDEPI.$('lista');
  if (!lista.length) {
    box.innerHTML = '<div class="pcf-vazio">Nenhuma PCF encontrada' +
      (termo || _filtroEtapa ? ' com esse filtro.' : '.') + '</div>';
    return;
  }

  box.innerHTML = lista.map(function (p) {
    var cls = CLASSE_ETAPA[p.etapa] || 'et-ou';

    /* Convênio que tem PCF mas não está na coluna A: não aparece em nenhum
       outro painel. Marcar aqui é o único lugar onde isso fica visível. */
    var fora = p.no_painel === false
      ? '<span class="pcf-fora" title="Este convênio não está na coluna A da ' +
        'planilha de vigências, então não aparece nos outros painéis">' +
        '<i class="fa-solid fa-triangle-exclamation"></i> fora do painel</span>'
      : '';

    /* DE ONDE VEM A ETAPA (18/08/2026).
       Até esta data a etapa era a coluna B da planilha do setor, digitada à
       mão — e em 17/08 oito de catorze estavam atrás do Transferegov, todas
       na mesma direção. Agora a etapa MOSTRADA é a do Transferegov, e a
       planilha ficou como fonte da Observação e do SEI, que só ela tem.

       O selo existe porque "concluída" lida do sistema e "concluída" digitada
       por alguém não valem o mesmo, e quem lê precisa saber qual das duas
       está vendo. Sem leitura do Tgov, a etapa continua sendo a da planilha e
       o selo diz isso — em vez de calar e deixar parecer que veio da fonte. */
    var selo = p.fonte_etapa === 'transferegov'
      ? '<span class="pcf-fonte tg" title="Situação lida do Transferegov' +
        (p.tgov_lido_em ? ' em ' + IDEPI.esc(p.tgov_lido_em) : '') + '">' +
        '<i class="fa-solid fa-circle-check"></i>Transferegov</span>'
      : '<span class="pcf-fonte pl" title="Ainda sem leitura do Transferegov ' +
        'para este instrumento — a etapa vem da planilha do setor">' +
        '<i class="fa-solid fa-pen"></i>planilha</span>';

    /* Divergência não pode sumir de vista: a etapa exibida virou a do
       Transferegov, então sem este aviso a planilha ficaria desatualizada em
       silêncio e ninguém iria corrigi-la. */
    var diverge = p.diverge_da_planilha
      ? '<span class="pcf-diverge" title="A planilha do setor ainda diz &quot;' +
        IDEPI.esc(p.etapa_rotulo_planilha || '') + '&quot;. Vale atualizar.">' +
        '<i class="fa-solid fa-triangle-exclamation"></i>planilha diz: ' +
        IDEPI.esc(p.etapa_rotulo_planilha || '?') + '</span>'
      : '';

    var meta = [];
    if (p.conta)     meta.push('<span><i class="fa-solid fa-building-columns"></i>' + IDEPI.esc(p.conta) + '</span>');
    if (p.periodo)   meta.push('<span><i class="fa-solid fa-calendar-days"></i>' + IDEPI.esc(p.periodo) + '</span>');
    if (p.processo)  meta.push('<span><i class="fa-solid fa-folder-open"></i>' + IDEPI.esc(p.processo) + '</span>');
    if (p.vigencia)  meta.push('<span><i class="fa-solid fa-hourglass-end"></i>vigência ' + IDEPI.esc(p.vigencia) + '</span>');
    if (p.fiscal)    meta.push('<span><i class="fa-solid fa-user"></i>' + IDEPI.esc(p.fiscal) + '</span>');

    var obs = p.observacao
      ? '<div class="pcf-obs"><strong>Observação (SEI)</strong>' + IDEPI.esc(p.observacao) + '</div>'
      : '<div class="pcf-obs vazia"><strong>Observação (SEI)</strong>sem registro</div>';

    return '<div class="pcf-item">' +
      '<div>' +
        '<a class="pcf-num num-link" href="execucao.html?num=' +
          encodeURIComponent(p.numero || '') + '" ' +
          'title="Abrir a execução financeira deste instrumento">' +
          IDEPI.esc(p.numero_orig || p.numero) + '</a>' +
        IDEPI.ficha.botao(p.numero || '') +
        '<span class="pcf-etapa ' + cls + '">' + IDEPI.esc(p.etapa_rotulo) + '</span>' +
        selo + diverge +
      '</div>' +
      '<div>' +
        '<div class="pcf-obj">' + IDEPI.esc(p.objeto || p.objeto_oficial || '—') + fora + '</div>' +
        '<div class="pcf-meta">' + meta.join('') + '</div>' +
      '</div>' +
      obs +
    '</div>';
  }).join('');
}

function exportarPcf() {
  IDEPI.comBotaoOcupado('btnExcelPcf', function () {
    var linhas = [['Nº', 'Etapa', 'Origem da etapa', 'Situação (Transferegov)',
                   'Situação (planilha do setor)', 'Etapa na planilha',
                   'Objeto', 'Conta', 'Período', 'Processo SEI',
                   'Observação (SEI)', 'Vigência', 'Fiscal', 'No painel?']];
    _pcfs.forEach(function (p) {
      linhas.push([p.numero_orig || p.numero, p.etapa_rotulo,
                   p.fonte_etapa === 'transferegov' ? 'Transferegov' : 'planilha do setor',
                   p.situacao_tgov || '', p.situacao,
                   p.etapa_rotulo_planilha || p.etapa_rotulo,
                   p.objeto || p.objeto_oficial || '', p.conta, p.periodo,
                   p.processo, p.observacao, p.vigencia || '', p.fiscal || '',
                   p.no_painel === false ? 'NÃO' : 'sim']);
    });
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(linhas), 'PCF');
    XLSX.writeFile(wb, 'IDEPI_PrestacaoContas_' + IDEPI.carimboData() + '.xlsx');
  });
}

IDEPI.dados.pcf()
  .then(function (d) {
    _pcfs = d.pcfs || [];
    var r = d.resumo || {};
    IDEPI.setTxt('e-ni', r.nao_iniciada || 0);
    IDEPI.setTxt('e-an', r.em_analise   || 0);
    IDEPI.setTxt('e-ap', r.aprovada     || 0);
    IDEPI.setTxt('e-cn', r.concluida    || 0);
    IDEPI.setTxt('hs-tot', _pcfs.length);
    IDEPI.setTxt('hd-ts', 'Atualizado: ' + (d.gerado_em || '—'));
    render();
    IDEPI.esconderOverlay();
  })
  .catch(function (e) {
    IDEPI.esconderOverlay();
    IDEPI.setHtml('hd-ts', '<span style="color:#f87171">Erro ao carregar</span>');
    IDEPI.setHtml('lista', '<div class="pcf-vazio">Não foi possível carregar as PCFs. ' +
      IDEPI.esc(String(e && e.message || e)) + '</div>');
  });
</script>
